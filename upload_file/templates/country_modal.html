<!-- Country Modal for detailed country editing -->
<div class="modal fade" id="country-modal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header position-relative">
                <h5 class="modal-title">Edit Countries Availability </h5>
                <div class="d-flex gap-2 p-2">
                    <button type="button" class="btn btn-sm btn-outline-success" id="set-all-available">
                        <i class="bi bi-check-all"></i> Set All Available
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-warning" id="set-all-aap">
                        <i class="bi bi-clock"></i> Set All AAP
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="clear-all">
                        <i class="bi bi-x-circle"></i> Clear All
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="apply-visibility-rules">
                        <i class="bi bi-magic"></i> Apply Visibility Rules
                    </button>
                </div>
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2 p-2" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Product info and visibility rule display -->
                <div class="alert alert-info mb-3" id="product-info-alert" style="display: none;">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <strong>Product:</strong> <span id="product-sku"></span><br>
                            <strong>E-commerce Visibility:</strong> 
                            <span id="product-visibility-rule" class="font-monospace"></span>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="auto-apply-rule">
                            <i class="bi bi-lightning"></i> Auto Apply Rule
                        </button>
                    </div>
                </div>
                
                <!-- Search countries -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="country-search" 
                               placeholder="Search countries... (e.g., IT, Italy, Europe)">
                        <button type="button" class="btn btn-outline-secondary" id="clear-search">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Quick filters -->
                <div class="mb-3 d-flex align-items-center gap-3">
                    <div class="btn-group btn-group-sm" role="group">
                        <input type="radio" class="btn-check" name="country-filter" id="filter-available" value="available">
                        <label class="btn btn-outline-success" for="filter-available">Available Only</label>
                        
                        <input type="radio" class="btn-check" name="country-filter" id="filter-not-available" value="not-available">
                        <label class="btn btn-outline-danger" for="filter-not-available">Not Available</label>
                        
                        <input type="radio" class="btn-check" name="country-filter" id="filter-aap" value="aap">
                        <label class="btn btn-outline-warning" for="filter-aap">AAP Only</label>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="reset-country-filter" style="display: none;">
                        <i class="bi bi-x-lg"></i> Show All
                    </button>
                </div>
                
                <!-- Countries organized by regions -->
                <div class="row">
                    <div class="col-12">
                        <div class="accordion" id="countries-accordion">
                            <!-- Europe 🇪🇺 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#europe-countries">
                                        🌍 Europe <!-- (<span id="europe-count" class="pr-2">0</span> countries)
                                        <span class="ms-auto me-2">
                                            <span class="badge bg-success" id="europe-available">0</span>
                                            <span class="badge bg-warning" id="europe-aap">0</span>
                                        </span> -->
                                    </button>
                                </h2>
                                <div id="europe-countries" class="accordion-collapse collapse show">
                                    <div class="accordion-body">
                                        <div class="row" id="europe-grid">
                                            <!-- Europe countries will be loaded here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Asia & Middle East -->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#asia-countries">
                                        🌏 Asia & Middle East <!-- (<span id="asia-count">0</span> countries)
                                        <span class="ms-auto me-2">
                                            <span class="badge bg-success" id="asia-available">0</span>
                                            <span class="badge bg-warning" id="asia-aap">0</span>
                                        </span> -->
                                    </button>
                                </h2>
                                <div id="asia-countries" class="accordion-collapse collapse">
                                    <div class="accordion-body">
                                        <div class="row" id="asia-grid">
                                            <!-- Asia countries will be loaded here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Americas -->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#americas-countries">
                                        🌎 Americas <!-- (<span id="americas-count">0</span> countries)
                                        <span class="ms-auto me-2">
                                            <span class="badge bg-success" id="americas-available">0</span>
                                            <span class="badge bg-warning" id="americas-aap">0</span>
                                        </span> -->
                                    </button>
                                </h2>
                                <div id="americas-countries" class="accordion-collapse collapse">
                                    <div class="accordion-body">
                                        <div class="row" id="americas-grid">
                                            <!-- Americas countries will be loaded here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Others -->
                            <!-- <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#other-countries">
                                        🌍 Others (<span id="others-count">0</span> countries)
                                        <!- - <span class="ms-auto me-2">
                                            <span class="badge bg-success" id="others-available">0</span>
                                            <span class="badge bg-warning" id="others-aap">0</span>
                                        </span> - ->
                                    </button>
                                </h2>
                                <div id="other-countries" class="accordion-collapse collapse">
                                    <div class="accordion-body">
                                        <div class="row" id="other-grid">
                                            <!- - Other countries will be loaded here -- >
                                        </div>
                                    </div>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="d-flex justify-content-between w-100">
                    <div>
                        <small class="text-muted">
                            <span id="available-count">0</span> available, 
                            <span id="aap-count">0</span> AAP, 
                            <span id="date-count">0</span> with dates
                        </small>
                    </div>
                    <div class="d-flex gap-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-success" id="save-countries">
                            <i class="bi bi-floppy"></i> Save Countries
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Country Card Template -->
<template id="country-card-template">
    <div class="col-md-6 col-lg-4 country-grid-item" data-country-code="">
        <div class="card h-100">
            <div class="card-body p-2">
                <div class="d-flex align-items-center mb-2">
                    <span class="country-flag me-2"></span>
                    <h6 class="card-title mb-0 country-name"></h6>
                </div>
                <div class="country-controls">
                    <select class="form-select form-select-sm mb-2 country-type">
                        <option value="not_available">Not Available</option>
                        <option value="available">Available</option>
                        <option value="as_available">AAP</option><!-- As Available -->
                        <option value="data_specifica">Specific Date</option>
                        <option value="to_be_determined">To Be Determined</option>
                    </select>
                    <input type="date" class="form-control form-control-sm country-date" style="display: none;">
                </div>
            </div>
        </div>
    </div>
</template>

<style>
/* Country Modal Specific Styles */
.country-grid-item {
    margin-bottom: 0.75rem;
}

.country-grid-item .card {
    border: 1px solid #e9ecef;
    transition: all 0.2s;
    min-height: 120px;
}

.country-grid-item .card:hover {
    border-color: #007bff;
    box-shadow: 0 2px 4px rgba(0,123,255,0.1);
}

.country-grid-item .card.country-available {
    border-color: #28a745;
    background-color: rgba(40,167,69,0.05);
}

.country-grid-item .card.country-aap {
    border-color: #ffc107;
    background-color: rgba(255,193,7,0.05);
}

.country-grid-item .card.country-date {
    border-color: #17a2b8;
    background-color: rgba(23,162,184,0.05);
}

.country-grid-item .card-title {
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.country-flag {
    font-size: 1.2rem;
    margin-right: 0.5rem;
}

.country-grid-item select,
.country-grid-item input {
    font-size: 0.8rem;
}

.accordion-button .badge {
    font-size: 0.65rem;
}

#product-info-alert {
    border-left: 4px solid #17a2b8;
}

.btn-check:checked + .btn-outline-success {
    background-color: var(--bs-success);
    border-color: var(--bs-success);
}
.btn-check:checked + .btn-outline-danger {
    background-color: var(--bs-danger);
    border-color: var(--bs-danger);
}
.btn-check:checked + .btn-outline-warning {
    background-color: var(--bs-warning);
    border-color: var(--bs-warning);
    color: #000;
}
</style>
