{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}Trance automation</title>

  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  {% block extra_head %}{% endblock %}
  <style>
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .h1,
    .h2,
    .h3,
    .h4,
    .h5,
    .h6,
    p {
      margin-top: 0;
      margin-bottom: 0;
    }
  </style>
</head>

<body class="bg-light">
  <header>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="position-fixed bottom-0 start-0 mb-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-secondary mx-4"><i class="bi bi-box-arrow-in-left"></i> Exit</button>
    </form>
    {% endif %}
    <!-- <h1>{% block header %}{% endblock %}</h1> -->
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    {% block footer %}{# © 2025 My Company #}{% endblock %}
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>

</html>
