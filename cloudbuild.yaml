steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    secretEnv: ['_SECRET_KEY', '_OKTA_CLIENT_ID', '_OKTA_CLIENT_SECRET', '_OKTA_ISSUER']
    args:
      - 'build'
      - '--build-arg'
      - 'SECRET_KEY=${_SECRET_KEY}' # Pass the secret as a build argument
      - '--build-arg'
      - 'OKTA_CLIENT_ID=${_OKTA_CLIENT_ID}'
      - '--build-arg'
      - 'OKTA_CLIENT_SECRET=${_OKTA_CLIENT_SECRET}'
      - '--build-arg'
      - 'OKTA_ISSUER=${_OKTA_ISSUER}'
      - '-t'
      - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '.'


  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

  # 3. Create or update the Cloud Run migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Update Migration Job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_SERVICE_NAME}-migrate'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_DEPLOY_REGION}'
      - '--set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest'
      - '--set-cloudsql-instances=${_DB_INSTANCE}'
      - '--update-env-vars=IS_MIGRATION_JOB=True'
      - '--task-timeout=600' # 10 minutes for migrations

  # 4. Run the database migration job and wait for it to complete
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run Migration'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_SERVICE_NAME}-migrate'
      - '--region=${_DEPLOY_REGION}'
      - '--wait'

  # 5. Deploy the application to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_DEPLOY_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated' # Set to --no-allow-unauthenticated for private services
      - '--port=8080'
      - '--set-secrets=SECRET_KEY=${_DJANGO_SECRET_KEY_SECRET_NAME}:latest,OKTA_ISSUER=${_OKTA_ISSUER_SECRET_NAME}:latest,OKTA_CLIENT_ID=${_OKTA_CLIENT_ID_SECRET_NAME}:latest,OKTA_CLIENT_SECRET=${_OKTA_CLIENT_SECRET_NAME}:latest'
      # The DATABASE_URL secret was commented out in your original file, uncomment if needed
      # - '--set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest'
      # - '--set-cloudsql-instances=${_DB_INSTANCE}'
      - '--update-env-vars=DJANGO_SETTINGS_MODULE=tranceautom.settings,DEBUG=False'

# Store the built image in Artifact Registry for deployment
images:
  - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

# Define substitution variables that can be configured in the Cloud Build trigger
substitutions:
  _SERVICE_NAME: 'tranche-autom'
  _DEPLOY_REGION: 'europe-west3'
  _GCR_HOSTNAME: 'europe-west3-docker.pkg.dev'
  _REPO_NAME: 'tranche-autom' # The name of your Artifact Registry repository
  _DJANGO_SECRET_KEY_SECRET_NAME: 'django-secret-key' # Name of the secret in Secret Manager
  _OKTA_ISSUER_SECRET_NAME: 'okta-issuer'
  _OKTA_CLIENT_ID_SECRET_NAME: 'okta-client-id'
  _OKTA_CLIENT_SECRET_NAME: 'okta-client-secret'
  # _DB_INSTANCE: 'your-project-id:your-region:your-instance-name' # The Cloud SQL instance connection name
  # _DATABASE_URL_SECRET: 'DATABASE_URL' # The name of the secret in Secret Manager containing the database URL

# Set a timeout for the entire build
timeout: '1800s'

# Make secrets from Secret Manager available to the build
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/${_DJANGO_SECRET_KEY_SECRET_NAME}/versions/latest
    env: '_SECRET_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/${_OKTA_CLIENT_ID_SECRET_NAME}/versions/latest
    env: '_OKTA_CLIENT_ID'
  - versionName: projects/${PROJECT_ID}/secrets/${_OKTA_CLIENT_SECRET_NAME}/versions/latest
    env: '_OKTA_CLIENT_SECRET'
  - versionName: projects/${PROJECT_ID}/secrets/${_OKTA_ISSUER_SECRET_NAME}/versions/latest
    env: '_OKTA_ISSUER'

# Configure logging to only use Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
