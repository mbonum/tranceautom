steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      - 'build'
      - '-t'
      - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '.'


  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

  # 3. Create or update the Cloud Run migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Migration Job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_SERVICE_NAME}-migrate'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_DEPLOY_REGION}'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-cloudsql-instances=${_DB_INSTANCE}'
      # Use a permissive ALLOWED_HOSTS for the migration job, as it's not user-facing.
      - '--update-env-vars=IS_MIGRATION_JOB=True,DJANGO_SETTINGS_MODULE=tranceautom.settings,ALLOWED_HOSTS=*'
      - '--task-timeout=600s' # 10 minutes
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-retries=1'

  # 4. Run the database migration job and wait for it to complete
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run Migration'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_SERVICE_NAME}-migrate'
      - '--region=${_DEPLOY_REGION}'
      - '--wait'

  # 5. Deploy the application to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_DEPLOY_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated' # Set to --no-allow-unauthenticated for private services
      - '--port=8080'
      - '--set-secrets=SECRET_KEY=django-secret-key:latest,OKTA_ISSUER=okta-issuer:latest,OKTA_CLIENT_ID=okta-client-id:latest,OKTA_CLIENT_SECRET=okta-client-secret:latest,DATABASE_URL=DATABASE_URL:latest,DB_PASSWORD=DB_PASSWORD:latest'
      - '--set-cloudsql-instances=${_DB_INSTANCE}'
      # Use a specific ALLOWED_HOSTS value for better security.
      # This should be configured in your Cloud Build trigger substitutions.
      - '--update-env-vars=DJANGO_SETTINGS_MODULE=tranceautom.settings,DEBUG=False,ALLOWED_HOSTS=${_ALLOWED_HOSTS}'

# Store the built image in Artifact Registry for deployment
images:
  - '${_GCR_HOSTNAME}/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

# Define substitution variables that can be configured in the Cloud Build trigger
substitutions:
  _SERVICE_NAME: 'tranche-autom'
  _DEPLOY_REGION: 'europe-west3'
  _GCR_HOSTNAME: 'europe-west3-docker.pkg.dev'
  _REPO_NAME: 'tranche-autom' # The name of your Artifact Registry repository
  _DB_INSTANCE: 'clz-tmp-innovation-dev:europe-west3:tranche-autom-db' # IMPORTANT: Replace with your actual Cloud SQL instance connection name
  # Add your service's domain(s) here, comma-separated.
  # e.g., 'tranche-autom-xyz.a.run.app,your-custom-domain.com'
  _ALLOWED_HOSTS: 'tranche-autom-xyz.a.run.app'

# Set a timeout for the entire build
timeout: '1800s'

# Configure logging to only use Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
